name: Paper probability bot tests
on:
  push:
    branches: [feat/probability-paper-bot]
  pull_request:
    paths:
      - paper_probability_bot.py
      - tests/test_paper_probability_bot.py
      - .github/workflows/paper-bot-tests.yml
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_paper_probability_bot.py' -v
